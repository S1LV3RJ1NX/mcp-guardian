# examples/scope.gateway.yaml — Via MCP Gateway
# Usage: cp examples/scope.gateway.yaml scope.yaml
#
# The Gateway handles OAuth for GitHub and routes to PostgreSQL.
# One token (TFY_TOKEN) authenticates to the Gateway.
# Gateway injects per-user OAuth tokens for each downstream server.
#
# mcp-guardian --config scope.yaml --scope support-agent

upstream_servers:
  github:
    url: https://gateway.truefoundry.ai/tfy-eo/mcp/github-mcp/server
    transport: auto
    auth:
      type: bearer_env
      value_env: TFY_TOKEN             # Gateway validates this token,
                                       # looks up user's GitHub OAuth token,
                                       # injects it when calling GitHub MCP.

  postgres:
    url: https://gateway.truefoundry.ai/tfy-eo/mcp/postgres-mcp/server
    transport: auto
    auth:
      type: bearer_env
      value_env: TFY_TOKEN             # Same token — Gateway routes to PG MCP.

scopes:
  support-agent:
    description: "Read-only tools for support agents"
    servers:
      github:
        allowed_tools:
          - get_me
          - list_issues
          - issue_read
          - list_pull_requests
          - pull_request_read
          - search_issues
          - search_code
      postgres:
        allowed_tools:
          - pg_read_query
          - pg_list_tables
          - pg_describe_table
          - pg_count
          - pg_exists
          - pg_explain
          - pg_table_stats

  developer:
    description: "Full access minus destructive operations"
    servers:
      github:
        allowed_tools: "*"
        blocked_tools:
          - delete_file
          - fork_repository
          - push_files
      postgres:
        allowed_tools: "*"
        blocked_tools:
          - pg_drop_table
          - pg_drop_index
          - pg_truncate
          - pg_terminate_backend

audit:
  enabled: true
  log_file: audit.log
  include_params: true
