<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mcp-guardian</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surface:#161b22;--border:#30363d;
  --text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;
  --green:#3fb950;--yellow:#d29922;--red:#f85149;
  --card-radius:12px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.5;padding:0}
a{color:var(--accent);text-decoration:none}

/* Header */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10}
.header h1{font-size:20px;font-weight:600;letter-spacing:-0.5px}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600}
.badge-scope{background:#1f6feb33;color:var(--accent);border:1px solid #1f6feb55}

/* Layout */
.container{max-width:1200px;margin:0 auto;padding:24px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:32px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--card-radius);padding:20px}
.card .label{font-size:12px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-bottom:4px}
.card .value{font-size:28px;font-weight:700;letter-spacing:-1px}
.card .value.accent{color:var(--accent)}
.card .value.green{color:var(--green)}
.card .sub{font-size:12px;color:var(--muted);margin-top:2px}

/* Search */
.search-section .search-box{width:100%;padding:10px 14px;font-size:14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border-color .15s}
.search-section .search-box:focus{border-color:var(--accent)}
.search-section .search-box::placeholder{color:var(--muted)}
.results{margin-top:12px;max-height:500px;overflow-y:auto}
.result-item{padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.result-item:hover{background:#1f6feb11}
.result-item .name{font-weight:600;font-size:14px;color:var(--accent)}
.result-item .server-tag{font-size:11px;color:var(--muted);margin-left:8px;padding:1px 6px;background:var(--bg);border-radius:4px;border:1px solid var(--border)}
.result-item .brief{font-size:13px;color:var(--muted);margin-top:2px}
.schema-preview{margin-top:8px;padding:10px;background:var(--bg);border-radius:6px;font-size:12px;font-family:"SF Mono",Consolas,monospace;white-space:pre-wrap;word-break:break-all;color:var(--muted);max-height:200px;overflow-y:auto;border:1px solid var(--border)}
.empty-state{padding:32px;text-align:center;color:var(--muted);font-size:13px}
.section-title{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}

/* Server Cards */
.servers-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-bottom:24px}
.srv-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--card-radius);overflow:hidden;transition:border-color .15s}
.srv-card:hover{border-color:#484f58}
.srv-card-header{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;user-select:none}
.srv-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.srv-icon.github{background:#21262d}
.srv-icon.database{background:#1a2332}
.srv-icon.twitter{background:#1c2128}
.srv-icon.server{background:#1c2128}
.srv-icon svg{width:22px;height:22px}
.srv-info{flex:1;min-width:0}
.srv-name{font-size:15px;font-weight:600;color:var(--text)}
.srv-meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:8px}
.srv-status{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}
.srv-status.connected{background:#23883833;color:var(--green)}
.srv-status.pending{background:#d2992233;color:var(--yellow)}
.srv-status.connecting{background:#1f6feb22;color:var(--accent)}
.srv-status-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.srv-status.connected .srv-status-dot{background:var(--green)}
.srv-status.pending .srv-status-dot{background:var(--yellow)}
.srv-status.connecting .srv-status-dot{background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.srv-tool-count{font-size:13px;color:var(--muted);font-weight:500}
.srv-actions{display:flex;gap:8px;padding:0 20px 16px;align-items:center;flex-wrap:wrap}
.btn{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;border:none;cursor:pointer;transition:all .15s}
.btn-connect{background:var(--accent);color:#0d1117}
.btn-connect:hover{background:#79c0ff}
.btn-refresh{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-refresh:hover{border-color:var(--muted);color:var(--text)}
.btn-disconnect{background:transparent;border:1px solid var(--border);color:var(--muted);font-size:11px}
.btn-disconnect:hover{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.srv-tools{border-top:1px solid var(--border);max-height:350px;overflow-y:auto;display:none}
.srv-tools.open{display:block}
.srv-tool-item{padding:8px 20px;border-bottom:1px solid var(--border);font-size:13px;display:flex;justify-content:space-between;align-items:center}
.srv-tool-item:last-child{border-bottom:none}
.srv-tool-item .tname{color:var(--text);font-weight:500}
.srv-tool-item .tbrief{font-size:11px;color:var(--muted);margin-top:1px}
.srv-tool-item .tcost{font-size:11px;color:var(--muted);font-family:"SF Mono",Consolas,monospace;flex-shrink:0;margin-left:12px}
.srv-empty{padding:20px;text-align:center;color:var(--muted);font-size:12px}

/* Key input */
.key-form{display:flex;gap:8px;align-items:center;width:100%}
.key-input{flex:1;padding:6px 10px;font-size:12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);outline:none;font-family:"SF Mono",Consolas,monospace}
.key-input:focus{border-color:var(--accent)}
.key-input::placeholder{color:var(--muted)}
.btn-save{background:var(--green);color:#0d1117}
.btn-save:hover{background:#56d364}
.key-saved{font-size:11px;color:var(--green);display:inline-flex;align-items:center;gap:4px}
</style>
</head>
<body>

<div class="header">
  <h1>mcp-guardian</h1>
  <span class="badge badge-scope" id="scope-badge">--</span>
</div>

<div class="container">
  <!-- Stats Cards -->
  <div class="stats-grid">
    <div class="card">
      <div class="label">Tools in Scope</div>
      <div class="value accent" id="stat-tools">--</div>
      <div class="sub" id="stat-excluded">-- excluded by scope</div>
    </div>
    <div class="card">
      <div class="label">Direct Token Cost</div>
      <div class="value" id="stat-direct">--</div>
      <div class="sub">without proxy</div>
    </div>
    <div class="card">
      <div class="label">Proxy Token Cost</div>
      <div class="value green" id="stat-proxy">--</div>
      <div class="sub">3 meta-tools only</div>
    </div>
    <div class="card">
      <div class="label">Savings</div>
      <div class="value green" id="stat-savings">--</div>
      <div class="sub" id="stat-servers">-- servers</div>
    </div>
  </div>

  <!-- Upstream Servers -->
  <div class="section-title" style="margin-bottom:16px"><span class="dot"></span> Upstream Servers</div>
  <div class="servers-grid" id="servers-grid">
    <div class="empty-state">Loading servers...</div>
  </div>

  <!-- Search -->
  <div class="card search-section">
    <div class="section-title"><span class="dot"></span> Tool Search</div>
    <input type="text" class="search-box" id="search-input" placeholder="Search tools... (e.g. tables, issues, query)">
    <div class="results" id="search-results">
      <div class="empty-state">Type a query to search available tools</div>
    </div>
  </div>
</div>

<script>
const API = '';
const LS_KEY_PREFIX = 'guardian_key_';

const ICONS = {
  github: '<svg viewBox="0 0 24 24" fill="currentColor" color="#e6edf3"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.866-.013-1.7-2.782.604-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836a9.59 9.59 0 012.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg>',
  database: '<svg viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4.03 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/></svg>',
  twitter: '<svg viewBox="0 0 24 24" fill="#e6edf3"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>',
  server: '<svg viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>'
};

function fmt(n) {
  return n == null ? '--' : n.toLocaleString();
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/* ---------- localStorage key helpers ---------- */
function getSavedKey(name) {
  try { return localStorage.getItem(LS_KEY_PREFIX + name) || ''; } catch { return ''; }
}
function saveKey(name, key) {
  try { localStorage.setItem(LS_KEY_PREFIX + name, key); } catch {}
}
function removeSavedKey(name) {
  try { localStorage.removeItem(LS_KEY_PREFIX + name); } catch {}
}

/* ---------- Stats ---------- */
async function loadStats() {
  try {
    const r = await fetch(API + '/api/stats');
    const d = await r.json();
    document.getElementById('scope-badge').textContent = 'scope: ' + d.scope;
    document.getElementById('stat-tools').textContent = fmt(d.tools_in_scope);
    document.getElementById('stat-excluded').textContent = fmt(d.tools_excluded) + ' excluded by scope';
    document.getElementById('stat-direct').textContent = fmt(d.direct_tokens);
    document.getElementById('stat-proxy').textContent = fmt(d.proxy_tokens);
    document.getElementById('stat-savings').textContent = d.savings_pct + '%';
    document.getElementById('stat-servers').textContent = d.servers.length + ' server' + (d.servers.length !== 1 ? 's' : '');
  } catch (e) { console.error('Stats error', e); }
}

/* ---------- Servers ---------- */
let expandedServers = new Set();

async function loadServers() {
  try {
    const r = await fetch(API + '/api/servers');
    const servers = await r.json();
    const grid = document.getElementById('servers-grid');
    if (!servers.length) {
      grid.innerHTML = '<div class="empty-state">No servers configured</div>';
      return;
    }
    grid.innerHTML = servers.map(s => renderServerCard(s)).join('');

    for (const s of servers) {
      if (s.needs_key && getSavedKey(s.name)) {
        autoRestoreKey(s.name);
      }
    }

    for (const name of expandedServers) {
      const toolsEl = document.getElementById('srv-tools-' + name);
      if (toolsEl) reloadServerTools(name, toolsEl);
    }
  } catch (e) { console.error('Servers error', e); }
}

function renderServerCard(s) {
  const icon = ICONS[s.icon] || ICONS.server;
  const statusClass = s.status;
  const statusLabel = s.status === 'connected' ? 'Connected'
    : s.status === 'connecting' ? 'Connecting...'
    : s.needs_key ? 'Needs API Key'
    : 'Pending OAuth';
  const toolLabel = s.status === 'connected' ? s.tool_count + ' tool' + (s.tool_count !== 1 ? 's' : '') : '';

  let actions = '';

  if (s.needs_key) {
    const saved = getSavedKey(s.name);
    actions = '<div class="srv-actions">' +
      '<div class="key-form">' +
        '<input type="password" class="key-input" id="key-input-' + esc(s.name) + '" ' +
          'placeholder="Paste API key..." value="' + esc(saved) + '">' +
        '<button class="btn btn-save" onclick="event.stopPropagation();submitKey(\'' + esc(s.name) + '\')">Save</button>' +
      '</div>' +
    '</div>';
  } else if (s.status === 'pending' && s.auth_type === 'oauth') {
    actions = '<div class="srv-actions">' +
      '<button class="btn btn-connect" onclick="connectServer(\'' + esc(s.name) + '\')">Connect</button>' +
      '</div>';
  } else if (s.status === 'connecting') {
    actions = '<div class="srv-actions">' +
      '<button class="btn btn-connect" disabled>Connecting...</button>' +
      '<button class="btn btn-refresh" onclick="refreshServer(\'' + esc(s.name) + '\')">Refresh</button>' +
      '</div>';
  } else if (s.status === 'connected' && s.auth_type === 'oauth') {
    actions = '<div class="srv-actions">' +
      '<button class="btn btn-disconnect" onclick="event.stopPropagation();disconnectServer(\'' + esc(s.name) + '\')">Disconnect</button>' +
      '</div>';
  } else if (s.status === 'connected' && s.auth_type === 'bearer_env') {
    actions = '<div class="srv-actions">' +
      '<span class="key-saved">Key active</span>' +
      '<button class="btn btn-disconnect" onclick="event.stopPropagation();removeKey(\'' + esc(s.name) + '\')">Remove Key</button>' +
      '</div>';
  }

  return '<div class="srv-card" id="srv-' + esc(s.name) + '">' +
    '<div class="srv-card-header" onclick="toggleServer(\'' + esc(s.name) + '\')">' +
      '<div class="srv-icon ' + esc(s.icon) + '">' + icon + '</div>' +
      '<div class="srv-info">' +
        '<div class="srv-name">' + esc(s.name) + '</div>' +
        '<div class="srv-meta">' +
          '<span class="srv-status ' + statusClass + '"><span class="srv-status-dot"></span> ' + statusLabel + '</span>' +
          (toolLabel ? '<span class="srv-tool-count">' + toolLabel + '</span>' : '') +
        '</div>' +
      '</div>' +
    '</div>' +
    actions +
    '<div class="srv-tools" id="srv-tools-' + esc(s.name) + '"></div>' +
  '</div>';
}

async function toggleServer(name) {
  const toolsEl = document.getElementById('srv-tools-' + name);
  if (!toolsEl) return;

  if (expandedServers.has(name)) {
    toolsEl.classList.remove('open');
    expandedServers.delete(name);
    return;
  }

  expandedServers.add(name);
  reloadServerTools(name, toolsEl);
}

async function reloadServerTools(name, toolsEl) {
  toolsEl.innerHTML = '<div class="srv-empty">Loading...</div>';
  toolsEl.classList.add('open');

  try {
    const r = await fetch(API + '/api/tools?server=' + encodeURIComponent(name));
    const tools = await r.json();
    if (!tools.length) {
      toolsEl.innerHTML = '<div class="srv-empty">No tools indexed for this server</div>';
      return;
    }
    toolsEl.innerHTML = tools.map(t =>
      '<div class="srv-tool-item">' +
        '<div><div class="tname">' + esc(t.name) + '</div>' +
          '<div class="tbrief">' + esc(t.brief) + '</div></div>' +
        '<span class="tcost">' + t.token_cost + ' tok</span>' +
      '</div>'
    ).join('');
  } catch (e) {
    toolsEl.innerHTML = '<div class="srv-empty">Error loading tools</div>';
  }
}

/* ---------- Key Management ---------- */
async function submitKey(name) {
  const input = document.getElementById('key-input-' + name);
  if (!input) return;
  const key = input.value.trim();
  if (!key) return;

  saveKey(name, key);

  try {
    await fetch(API + '/api/servers/' + encodeURIComponent(name) + '/key', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: key })
    });
    await loadServers();
    loadStats();
  } catch (e) { console.error('Key submit error', e); }
}

async function removeKey(name) {
  removeSavedKey(name);
  try {
    await fetch(API + '/api/servers/' + encodeURIComponent(name) + '/key', { method: 'DELETE' });
    expandedServers.delete(name);
    await loadServers();
    await loadStats();
  } catch (e) { console.error('Remove key error', e); }
}

let _restoredKeys = new Set();
async function autoRestoreKey(name) {
  if (_restoredKeys.has(name)) return;
  _restoredKeys.add(name);
  const key = getSavedKey(name);
  if (!key) return;
  try {
    await fetch(API + '/api/servers/' + encodeURIComponent(name) + '/key', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: key })
    });
    setTimeout(() => { loadServers(); loadStats(); }, 2000);
  } catch (e) { console.error('Auto-restore key error', e); }
}

/* ---------- OAuth ---------- */
async function disconnectServer(name) {
  try {
    await fetch(API + '/api/servers/' + encodeURIComponent(name) + '/disconnect', { method: 'POST' });
    expandedServers.delete(name);
    await loadServers();
    await loadStats();
  } catch (e) { console.error('Disconnect error', e); }
}

async function connectServer(name) {
  try {
    await fetch(API + '/api/servers/' + encodeURIComponent(name) + '/connect', { method: 'POST' });
    await loadServers();
    loadStats();
  } catch (e) { console.error('Connect error', e); }
}

async function refreshServer(name) {
  expandedServers.add(name);
  await loadServers();
  await loadStats();
}

/* ---------- Search ---------- */
let searchTimeout;
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(doSearch, 200);
});

let expandedTool = null;

async function doSearch() {
  const q = searchInput.value.trim();
  if (!q) {
    searchResults.innerHTML = '<div class="empty-state">Type a query to search available tools</div>';
    return;
  }
  try {
    const r = await fetch(API + '/api/search?q=' + encodeURIComponent(q));
    const results = await r.json();
    if (!results.length) {
      searchResults.innerHTML = '<div class="empty-state">No tools matching "' + esc(q) + '"</div>';
      return;
    }
    searchResults.innerHTML = results.map(r =>
      '<div class="result-item" data-tool="' + esc(r.name) + '">' +
        '<div><span class="name">' + esc(r.name) + '</span><span class="server-tag">' + esc(r.server) + '</span></div>' +
        '<div class="brief">' + esc(r.brief) + '</div>' +
        '<div class="schema-slot" id="schema-' + esc(r.name) + '"></div>' +
      '</div>'
    ).join('');
    searchResults.querySelectorAll('.result-item').forEach(item => {
      item.addEventListener('click', () => toggleSchema(item.dataset.tool));
    });
  } catch (e) { console.error('Search error', e); }
}

async function toggleSchema(toolName) {
  const slot = document.getElementById('schema-' + toolName);
  if (!slot) return;
  if (expandedTool === toolName) {
    slot.innerHTML = '';
    expandedTool = null;
    return;
  }
  expandedTool = toolName;
  slot.innerHTML = '<div class="schema-preview">Loading...</div>';
  try {
    const r = await fetch(API + '/api/schema/' + encodeURIComponent(toolName));
    const schema = await r.json();
    slot.innerHTML = '<div class="schema-preview">' + esc(JSON.stringify(schema, null, 2)) + '</div>';
  } catch (e) {
    slot.innerHTML = '<div class="schema-preview">Error loading schema</div>';
  }
}

/* ---------- Init ---------- */
loadStats();
loadServers();
</script>
</body>
</html>
