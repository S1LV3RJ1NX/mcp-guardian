[project]
name = "mcp-guardian"
version = "0.1.0"
description = "MCP proxy for tool scoping and progressive discovery"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
authors = [
    {name = "Prathamesh Saraf"}
]
keywords = ["mcp", "proxy", "tools", "context", "progressive-discovery"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastmcp>=2.0.0",
    "pyyaml>=6.0",
    "tiktoken>=0.7.0",
    "pydantic-settings>=2.0.0",
    "openai>=2.35.1",
]

[project.optional-dependencies]
fuzzy = [
    "rapidfuzz>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
    "coverage>=7.0",
    "pre-commit>=4.6.0",
]

[project.scripts]
mcp-guardian = "mcp_guardian.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires upstream MCP servers to be running",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
